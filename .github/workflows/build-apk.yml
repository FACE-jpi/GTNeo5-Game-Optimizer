
name: Build GT Neo 5 APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract project
        run: |
          mkdir project
          unzip GTNeo5_Game_Optimizer_Shizuku_AutoBuild.zip -d project

      - name: Build APK
        run: gradle -p project --no-daemon :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: GTNeo5-Game-Optimizer-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          
