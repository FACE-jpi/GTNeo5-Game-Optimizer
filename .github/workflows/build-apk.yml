name: Build GT Neo 5 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under ANDROID_HOME=$ANDROID_HOME"
            exit 1
          fi
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract Android project from uploaded ZIP
        shell: bash
        run: |
          mkdir -p project
          unzip -q GTNeo5_Game_Optimizer_Shizuku_AutoBuild.zip -d project
          test -f project/settings.gradle
          test -f project/app/build.gradle

      - name: Set Java and Kotlin target to 17
        shell: bash
        run: |
          cat >> project/app/build.gradle <<'EOF'

          android {
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          EOF

      - name: Build debug APK
        run: gradle -p project --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GTNeo5-Game-Optimizer-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
